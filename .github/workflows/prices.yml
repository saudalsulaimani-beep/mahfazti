name: تحديث الأسعار ونشر الموقع

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # بدايات احتياطية للسلسلة. الجدولة المجانية في GitHub تتأخر وتسقط كثير، فالاعتماد الأساسي على السلسلة نفسها
    - cron: "50 6 * * 0-4"
    - cron: "20,50 7-11 * * 0-4"
    # بعد الإغلاق: الإغلاق الرسمي
    - cron: "40 12 * * 0-4"

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: آخر نسخة منشورة من الأسعار والبيانات المالية
        run: |
          base="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data"
          curl -fsSL "$base/market.json?x=$RANDOM" -o data/market.json || echo "لا توجد نسخة سابقة من الأسعار"
          curl -fsSL "$base/fundamentals.json?x=$RANDOM" -o data/fundamentals.json || echo "لا توجد نسخة سابقة من البيانات المالية"

      - name: جلب الأسعار (سنة كاملة أول مرة باليوم، وبعدها آخر الأسعار)
        run: node scripts/fetch-prices.mjs

      - name: البيانات المالية (مرة كل ١٢ ساعة)
        run: node scripts/fetch-fundamentals.mjs

      - name: نبضة أسبوعية حتى لا يوقف GitHub الجدولة
        if: github.event_name == 'schedule' && github.event.schedule == '40 12 * * 0-4'
        run: |
          if [ "$(date -u +%u)" = "4" ]; then
            date -u +%F > data/heartbeat.txt
            git config user.name "mahfazti-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/heartbeat.txt
            git commit -m "heartbeat" && git push || true
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: تأكد إن حلقة الأسعار الحية شغالة (وقت التداول)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          t=$((10#$(TZ=Asia/Riyadh date +%H%M))); d=$(TZ=Asia/Riyadh date +%u)
          if { [ "$d" = "7" ] || [ "$d" -le 4 ]; } && [ "$t" -ge 930 ] && [ "$t" -le 1500 ]; then
            busy=0
            for st in in_progress queued pending; do c=$(gh api "repos/$REPO/actions/workflows/live.yml/runs?status=$st" --jq .total_count); busy=$((busy + c)); done
            if [ "$busy" = "0" ]; then gh workflow run live.yml --ref main && echo "شغّلت حلقة الأسعار الحية"; else echo "الحلقة شغالة"; fi
          else
            echo "خارج وقت التداول"
          fi
